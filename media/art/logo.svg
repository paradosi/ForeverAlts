<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Forever Alts: three characters, one behind another, in wowdb.dev's navy and gold -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#1f2638"/>
      <stop offset="1" stop-color="#10131d"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d595"/>
      <stop offset="1" stop-color="#c9973f"/>
    </linearGradient>
    <clipPath id="frame"><rect x="20" y="20" width="360" height="360" rx="72"/></clipPath>
  </defs>
  <rect x="20" y="20" width="360" height="360" rx="72" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <!-- back two: outlines only, fading -->
    <g fill="none" stroke="#e3b664" stroke-width="12" opacity="0.35">
      <circle cx="112" cy="168" r="44"/>
      <path d="M36 380 C36 290 70 244 112 244 C154 244 188 290 188 380"/>
    </g>
    <g fill="none" stroke="#e3b664" stroke-width="12" opacity="0.6">
      <circle cx="288" cy="168" r="44"/>
      <path d="M212 380 C212 290 246 244 288 244 C330 244 364 290 364 380"/>
    </g>
    <!-- front: solid gold, edged in navy so it sits on top -->
    <g fill="url(#gold)" stroke="#161b29" stroke-width="14">
      <circle cx="200" cy="150" r="58"/>
      <path d="M100 392 C100 284 146 226 200 226 C254 226 300 284 300 392 Z"/>
    </g>
  </g>
  <rect x="20" y="20" width="360" height="360" rx="72" fill="none" stroke="#e3b664" stroke-opacity="0.55" stroke-width="6"/>
</svg>
